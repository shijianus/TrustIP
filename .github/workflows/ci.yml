name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least-privilege GITHUB_TOKEN: tests + build only need to read the repo.
permissions:
  contents: read

jobs:
  check:
    name: Test + Build
    runs-on: ubuntu-latest
    # Normal run is ~1 min; a hosted runner that loses its connection would
    # otherwise sit "in progress" for the 6h default before failing.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        # Reads the `packageManager` field in package.json to pin the pnpm version,
        # so CI uses the exact same pnpm as local dev.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # One source of truth for the Node line: .nvmrc (package.json
          # `engines` states the supported range, .nvmrc the one CI runs).
          node-version-file: .nvmrc
          # The committed pnpm-lock.yaml lets setup-node cache the pnpm store keyed
          # off the lockfile hash — installs are warm on every run after the first.
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile: install strictly from the lockfile and fail if it is
        # out of sync with package.json, rather than silently rewriting it.
        run: pnpm install --frozen-lockfile

      - name: Translation status
        # Locale progress dashboard into the run summary, so a translation PR's
        # author and reviewer see coverage and the next keys to translate without
        # a local run. Report only — the script always exits 0; the mechanical
        # gate for locale packs lives in pnpm test below.
        run: |
          {
            echo '```text'
            node scripts/i18n-status.js
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build
