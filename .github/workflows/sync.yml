name: Upstream Sync

# TrustMy.IP is a derivative of jason5ng32/MyIP and stays one: keeping the
# upstream flow of fixes and features is what makes the fork worth using, so
# this is the one workflow that deliberately references the upstream repo.
# It only ever *reads* upstream and merges into our own branch — it publishes
# nothing under the upstream's name (compare docker-image.yml, which does, and
# is therefore parked).
#
# Two things were changed from the upstream copy of this file, both to make it
# actually run here:
#   - target_sync_branch is `dev`, not `main`. Repository rule: dev in, dev
#     out — main only moves through a dev → main PR, so an automated merge must
#     not land on main with contents:write.
#   - the old `if: github.event.repository.fork` guard is gone. This repo was
#     created by pushing a clone, not by GitHub's Fork button, so that flag is
#     false forever and the schedule would silently never sync.

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest

    steps:
      # step 1: checkout target repo
      - name: Checkout target repo
        uses: actions/checkout@v6

      # step 2: sync upstream changes
      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: jason5ng32/MyIP
          upstream_sync_branch: main
          target_sync_branch: dev
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # auto-generated, no need to set

          # set test_mode to true to run tests instead of the real action!
          test_mode: false

      # error check
      - name: Sync check
        if: failure()
        run: |
          echo "::error::The scheduled upstream sync failed. Most often GitHub has suspended the schedule after a change to a workflow file, or the merge conflicted with our own edits (branding, workflows, docs). Re-run this workflow manually from the Actions tab; resolve conflicts by hand if it fails again."
          exit 1
