<?xml version="1.0" encoding="UTF-8"?>
<!-- TrustMy.IP app tile — the beacon mark on its ink ground, in a rounded
     square so it reads as an app icon on any surface (light or dark hosts,
     installers, launchers). The container and ground are explicit solids; the
     mark itself still paints with `currentColor`, pinned to paper here so the
     tile is self-contained. Geometry is shared with public/favicon.svg,
     frontend/components/svgicons/Brand.vue and the index.html boot overlay. -->
<svg width="512" height="512" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>TrustMy.IP</title>
    <rect x="0" y="0" width="24" height="24" rx="5.2" fill="#0e0e0e" />
    <g id="emitter-icon" fill="currentColor" color="#f4f4f4" fill-rule="evenodd"
        transform="translate(12 12) scale(0.66) translate(-12 -12)">
        <circle cx="12" cy="12" r="2.3" />
        <path d="M 16.879 7.121 A 6.9 6.9 0 1 1 7.121 7.121 L 8.818 8.818 A 4.5 4.5 0 1 0 15.182 8.818 Z" />
        <path d="M 20.061 3.939 A 11.4 11.4 0 1 1 3.939 3.939 L 5.495 5.495 A 9.2 9.2 0 1 0 18.505 5.495 Z" />
    </g>
</svg>
