<?xml version="1.0" encoding="UTF-8"?>
<!-- TrustMy.IP mark — the beacon. A solid core node (the address itself) sits
     inside two concentric radiating bands that share one 90° aperture aimed
     straight up, so the pair reads as a signal leaving the node: what you have,
     and what the network says about it. The aperture is axis-aligned on
     purpose — a diagonal one shatters into aliasing at 16px. Shapes are filled
     annulus sectors, never strokes, so any consumer that sets only `fill`
     paints them; they carry `currentColor`, and `color` follows the OS scheme,
     so this single file serves light and dark. The same geometry lives in
     frontend/components/svgicons/Brand.vue and in the boot overlay of
     index.html — change all three together. -->
<svg width="512" height="512" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>TrustMy.IP</title>
    <style>
        svg { color: #0e0e0e; }
        @media (prefers-color-scheme: dark) { svg { color: #f4f4f4; } }
    </style>
    <g id="emitter-icon" fill="currentColor" fill-rule="evenodd">
        <circle cx="12" cy="12" r="2.3" />
        <path d="M 16.879 7.121 A 6.9 6.9 0 1 1 7.121 7.121 L 8.818 8.818 A 4.5 4.5 0 1 0 15.182 8.818 Z" />
        <path d="M 20.061 3.939 A 11.4 11.4 0 1 1 3.939 3.939 L 5.495 5.495 A 9.2 9.2 0 1 0 18.505 5.495 Z" />
    </g>
</svg>
