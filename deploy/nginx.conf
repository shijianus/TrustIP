# Nginx alternative to deploy/Caddyfile — same topology, certificates from
# certbot (`certbot --nginx -d trustip.example.com` or webroot below).
# Walkthrough: docs/deploy-vps.zh-TW.md. Drop into /etc/nginx/conf.d/ (or
# sites-available/ + symlink) and replace trustip.example.com.
#
# /api/ goes straight to the backend (127.0.0.1:11966) with X-Forwarded-For SET
# to $remote_addr — never $proxy_add_x_forwarded_for, which would append to the
# copy the client sent and let it pick its own address. The backend's default
# TRUST_PROXY (loopback) then resolves the real visitor. Everything else goes
# to frontend-server.js (127.0.0.1:18966).

upstream trustip_backend {
    server 127.0.0.1:11966;
    keepalive 16;
}

upstream trustip_frontend {
    server 127.0.0.1:18966;
    keepalive 16;
}

# Port 80: ACME http-01 challenges, everything else → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name trustip.example.com www.trustip.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trustip.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trustip.example.com;

    ssl_certificate     /etc/letsencrypt/live/trustip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trustip.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:trustip_tls:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Above every body the app accepts (500 KB JSON, 1 MB Sentry tunnel).
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_set_header X-Forwarded-For $remote_addr;
        # The slowest routes (OONI, ASN profile) answer within ~60 s.
        proxy_read_timeout 75s;
        proxy_pass http://trustip_backend;
    }

    location / {
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://trustip_frontend;
    }

    access_log /var/log/nginx/trustip.access.log;
    error_log  /var/log/nginx/trustip.error.log warn;
}
